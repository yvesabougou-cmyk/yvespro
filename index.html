<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yvs_Prod Transport</title>
<style>
body{margin:0;font-family:Arial;background:#f4f7f5;color:#111827}
.container{max-width:1200px;margin:auto;padding:20px}
header{background:#064e3b;color:white;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:12px;margin-top:6px;margin-bottom:16px;border:1px solid #ccc;border-radius:10px}
button{background:#065f46;color:white;border:none;padding:12px 18px;border-radius:12px;font-weight:bold;cursor:pointer}
#annonces{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.photo{height:180px;background:#ecfdf5;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;background:#d1fae5;color:#065f46;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold;margin-top:12px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.admin{background:#f8fafc;padding:20px;border-radius:18px;margin-top:30px}
@media(max-width:800px){.grid,.filters{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<div class="container">
<h1>Yvs_Prod Transport</h1>
<p>Plateforme de transport professionnel</p>
</div>
</header>

<div class="container">

<div class="filters">
<div>
<label>Ville</label>
<input id="filterVille" oninput="renderPublic()">
</div>

<div>
<label>Catégorie</label>
<select id="filterCategorie" onchange="renderPublic()">
<option value="">Toutes</option>
<option>VTC</option>
<option>Fourgon</option>
<option>Camion</option>
<option>Tricycle</option>
</select>
</div>

<div>
<label>Service</label>
<select id="filterService" onchange="renderPublic()">
<option value="">Tous</option>
<option>Déménagement</option>
<option>Transport de marchandises</option>
<option>Courses de personnes</option>
<option>Approvisionnement</option>
</select>
</div>
</div>

<div class="grid">

<div class="card">
<h2>Publier une annonce</h2>

<label>Nom</label>
<input id="nom">

<label>Téléphone</label>
<input id="telephone">

<label>Ville</label>
<input id="ville">

<label>Catégorie</label>
<select id="categorie">
<option>VTC</option>
<option>Fourgon</option>
<option>Camion</option>
<option>Tricycle</option>
</select>

<label>Service</label>
<select id="service">
<option>Déménagement</option>
<option>Transport de marchandises</option>
<option>Courses de personnes</option>
<option>Approvisionnement</option>
</select>

<label>Prix</label>
<input id="prix">

<label>Description</label>
<textarea id="description"></textarea>

<label>Photo véhicule</label>
<input type="file" id="photo" accept="image/*">

<button onclick="ajouterAnnonce()">Envoyer l'annonce</button>

<p id="uploadStatus"></p>

</div>

<div class="card">
<h2>Annonces validées</h2>
<div id="annonces"></div>
</div>

</div>

<div class="admin">
<h2>Administration</h2>

<label>Code admin</label>
<input type="password" id="adminCode">

<button onclick="ouvrirAdmin()">Ouvrir administration</button>

<div id="adminPanel" style="display:none">
<h3>En attente</h3>
<div id="pending"></div>

<h3>Validées</h3>
<div id="validated"></div>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLKw23aA-ZOKLWKVUDIQtKQhfeDqWueZs",
  authDomain: "yvpro-f6f87.firebaseapp.com",
  projectId: "yvpro-f6f87",
  storageBucket: "yvpro-f6f87.firebasestorage.app",
  messagingSenderId: "795836828328",
  appId: "1:795836828328:web:a5d02cb801342026a4d09d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const ADMIN_CODE = "655090932";

let cache = [];
let adminOpen = false;

window.ajouterAnnonce = async function() {

  try {

    uploadStatus.innerText = "Téléchargement photo...";

    let photoUrl = "";

    const file = document.getElementById("photo").files[0];

    if(file){

      const storageRef = ref(storage, "vehicules/" + Date.now() + "_" + file.name);

      await uploadBytes(storageRef, file);

      photoUrl = await getDownloadURL(storageRef);
    }

    await addDoc(collection(db, "annonces"), {
      nom: nom.value,
      telephone: telephone.value,
      ville: ville.value,
      categorie: categorie.value,
      service: service.value,
      prix: prix.value,
      description: description.value,
      photoUrl: photoUrl,
      statut: "en attente",
      createdAt: new Date()
    });

    uploadStatus.innerText = "Annonce envoyée avec succès.";

  } catch(e){
    console.error(e);
    uploadStatus.innerText = "Erreur Firebase Storage ou Firestore.";
  }
}

function annonceHTML(a,id,admin=false){

  return `
  <div class="card">
    <div class="photo">
      ${a.photoUrl ? `<img src="${a.photoUrl}">` : "🚚"}
    </div>

    <span class="badge">${a.categorie} - ${a.statut}</span>

    <h3>${a.nom}</h3>

    <p><b>Ville :</b> ${a.ville}</p>
    <p><b>Service :</b> ${a.service}</p>
    <p><b>Prix :</b> ${a.prix}</p>
    <p>${a.description}</p>

    ${
      admin
      ?
      `
      <button onclick="valider('${id}')">Valider</button>
      <button onclick="attente('${id}')">Attente</button>
      <button onclick="supprimer('${id}')">Supprimer</button>
      `
      :
      `<a href="tel:${a.telephone}"><button>Appeler</button></a>`
    }

  </div>
  `;
}

window.renderPublic = function(){

  annonces.innerHTML = "";

  const ville = filterVille.value.toLowerCase();
  const cat = filterCategorie.value;
  const serv = filterService.value;

  cache
    .filter(x => x.data.statut === "validée")
    .filter(x => !ville || x.data.ville.toLowerCase().includes(ville))
    .filter(x => !cat || x.data.categorie === cat)
    .filter(x => !serv || x.data.service === serv)
    .forEach(x => {
      annonces.innerHTML += annonceHTML(x.data,x.id,false);
    });
}

window.ouvrirAdmin = function(){

  if(adminCode.value !== ADMIN_CODE){
    alert("Code incorrect");
    return;
  }

  adminOpen = true;
  adminPanel.style.display = "block";

  renderAdmin();
}

function renderAdmin(){

  if(!adminOpen) return;

  pending.innerHTML = "";
  validated.innerHTML = "";

  cache.forEach(x => {

    if(x.data.statut === "validée"){
      validated.innerHTML += annonceHTML(x.data,x.id,true);
    } else {
      pending.innerHTML += annonceHTML(x.data,x.id,true);
    }

  });
}

window.valider = async function(id){
  await updateDoc(doc(db,"annonces",id), { statut: "validée" });
}

window.attente = async function(id){
  await updateDoc(doc(db,"annonces",id), { statut: "en attente" });
}

window.supprimer = async function(id){
  await deleteDoc(doc(db,"annonces",id));
}

onSnapshot(collection(db,"annonces"), snap => {

  cache = [];

  snap.forEach(d => {
    cache.push({
      id: d.id,
      data: d.data()
    });
  });

  renderPublic();
  renderAdmin();
});
</script>

</body>
</html>
